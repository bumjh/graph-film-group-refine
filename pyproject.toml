[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-film-group-refine"
version = "0.1.0"
description = "Graph-FiLM group refinement experiments for retinal glaucoma classification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bumjh" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_film_group_refine*"]
